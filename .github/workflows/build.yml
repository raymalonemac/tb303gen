name: Build plugins
on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release
      - name: Check it is universal
        run: lipo -archs "build/TB303Gen_artefacts/Release/VST3/TB-303 Gen.vst3/Contents/MacOS/TB-303 Gen"
      - name: Package
        run: |
          mkdir out
          cp -R "build/TB303Gen_artefacts/Release/VST3/TB-303 Gen.vst3" out/
          cp -R "build/TB303Gen_artefacts/Release/AU/TB-303 Gen.component" out/
          cp -R "build/TB303Gen_artefacts/Release/Standalone/TB-303 Gen.app" out/
          cd out && zip -ry ../TB303Gen-universal.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TB303Gen-universal
          path: TB303Gen-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item -Recurse "build/TB303Gen_artefacts/Release/VST3/TB-303 Gen.vst3" out/
          Copy-Item "build/TB303Gen_artefacts/Release/Standalone/TB-303 Gen.exe" out/
          Compress-Archive -Path out/* -DestinationPath TB303Gen-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TB303Gen-windows
          path: TB303Gen-windows.zip
